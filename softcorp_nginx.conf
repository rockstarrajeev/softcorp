server {
    listen 443 ssl;
    server_name wesoftcorp.com www.wesoftcorp.com;
    ssl_certificate /etc/letsencrypt/live/wesoftcorp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wesoftcorp.com/privkey.pem; # managed by Certbot

    location /downloads/ {
        alias /var/www/downloads/;
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;
        tcp_nodelay on;
        types {
            application/vnd.microsoft.portable-executable exe;
        }
        default_type application/vnd.microsoft.portable-executable;
        add_header Content-Disposition "attachment";
        add_header Accept-Ranges bytes;
        add_header Access-Control-Allow-Origin "*";
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    if ($host = www.wesoftcorp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = wesoftcorp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name wesoftcorp.com www.wesoftcorp.com;
    return 301 https://$host$request_uri;
}
